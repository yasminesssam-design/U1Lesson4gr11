<style>
*{box-sizing:border-box}

body{margin:0;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;font-size:22px;line-height:1.9;color:#0b2447;background:linear-gradient(120deg,#dff1ff,#efe3ff,#d9fbe6,#fff4cc);background-size:400% 400%;animation:bgm 16s ease infinite;min-height:100vh;overflow-x:hidden}

.t1{background:linear-gradient(135deg,#1e88e5,#0d47a1)}.t2{background:linear-gradient(135deg,#43a047,#1b5e20)}
.t3{background:linear-gradient(135deg,#fb8c00,#e65100)}.t4{background:linear-gradient(135deg,#8e24aa,#4a148c)}
.t5{background:linear-gradient(135deg,#e53935,#b71c1c)}.t6{background:linear-gradient(135deg,#00acc1,#006064)}

.c2{background:linear-gradient(90deg,#2e7d32,#66bb6a)}.c3{background:linear-gradient(90deg,#6a1b9a,#ab47bc)}
.c4{background:linear-gradient(90deg,#ef6c00,#ffa726)}

.box.obj{background:#fff0f0;border-color:#ef5350}.box.key{background:#e8f5e9;border-color:#43a047}
.box.think{background:#fff9db;border-color:#f9a825}.box.term{background:#fce4ec;border-color:#d81b60}

.p1{background:#1e88e5}.p2{background:#8e24aa}.p3{background:#43a047}.p4{background:#fb8c00}
table{border-collapse:collapse;width:calc(100% - 48px);margin:10px 24px;font-size:21px}

.qbtns{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;margin-bottom:0;justify-content:center}
.bigbtn{border:0;border-radius:40px;font:inherit;font-size:23px;font-weight:800;color:#fff;padding:12px 30px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.bigbtn.g{background:#2e7d32}.bigbtn.b{background:#1565c0}.bigbtn.o{background:#ef6c00}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
#modal{position:fixed;inset:0;background:rgba(8,20,48,.78);z-index:50;overflow-y:auto;padding:14px}
.hidden{display:none}
.mbox{max-width:900px;margin:0 auto;background:#fff;border-radius:28px;padding:20px 24px 28px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.x{position:absolute;top:10px;inset-inline-end:14px;border:0;background:#ffebee;color:#c62828;font-size:26px;border-radius:50%;width:48px;height:48px;cursor:pointer}
.mt{font-size:24px;font-weight:900;color:#0b3d91;margin:0 56px 6px 0;line-height:1.5}

.pbar i{display:block;height:100%;background:linear-gradient(90deg,#43a047,#fdd835);transition:.4s}
.meta{display:flex;justify-content:space-between;font-size:20px;font-weight:700}
.qq{font-size:26px;font-weight:800;line-height:1.8;margin:14px 0;background:#f4f8ff;border-radius:18px;padding:12px 18px}
.opt{display:block;width:100%;text-align:start;font:inherit;font-size:24px;font-weight:700;margin:10px 0;padding:12px 18px;border-radius:18px;border:3px solid #90caf9;background:#fff;cursor:pointer;transition:.12s;color:#0b2447}
.opt:hover:not([disabled]){background:#e3f2fd;transform:scale(1.015)}
.opt b{display:inline-block;min-width:44px;height:44px;line-height:44px;border-radius:50%;background:#1565c0;color:#fff;text-align:center;margin-inline-end:12px}
.opt.sel{border-color:#6a1b9a;background:#f3e5f5}
.opt.right{background:#c8f7d0;border-color:#2e7d32}.opt.bad{background:#ffd0d0;border-color:#c62828}
.txt{width:100%;font:inherit;font-size:25px;padding:12px 16px;border:3px solid #90caf9;border-radius:16px}
.fb{font-size:25px;font-weight:900;border-radius:18px;padding:10px 18px;margin:12px 0;display:none}
.fb.ok{display:block;background:#c8f7d0;color:#1b5e20}.fb.no{display:block;background:#ffd0d0;color:#b71c1c}
.shake{animation:sh .5s}.pulse{animation:pl .5s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
@keyframes pl{50%{transform:scale(1.03);box-shadow:0 0 40px #66bb6a}}
.em{position:fixed;z-index:99;font-size:44px;pointer-events:none;animation:em 1.6s ease-out forwards}
@keyframes em{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(var(--dy)) translateX(var(--dx)) scale(1.5) rotate(200deg)}}
.res{text-align:center}
.res .big{font-size:90px;line-height:1.2}
.res .sc{font-size:40px;font-weight:900;color:#0b3d91}
.namein{width:100%;font:inherit;font-size:28px;padding:12px;border-radius:16px;border:3px solid #1565c0;text-align:center;margin:14px 0}
.ota{width:100%;min-height:90px;font:inherit;font-size:21px;border:3px solid #90caf9;border-radius:14px;padding:10px;margin:8px 0}
.lang2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){body{font-size:20px}.lang2{grid-template-columns:1fr}.hero h2{font-size:28px}.ph{font-size:24px}}

.tr{display:block;font-size:.82em;color:#6a1b9a;font-weight:700;margin-top:4px;line-height:1.7}
.qq .tr{font-size:.8em;margin-top:8px;border-top:2px dashed #ce93d8;padding-top:6px}
.opt .ot{display:block}
.opt .tr{margin-inline-start:56px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 16px!important}
.col{min-width:0;border-radius:20px;padding:8px 6px}
.col.en{background:#fff}.col.ar{background:#faf4ff;border:2px dashed #ce93d8}
.col .lab{display:inline-block;background:#0b3d91;color:#fff;border-radius:20px;padding:0 16px;font-size:18px;font-weight:800;margin:4px 8px}
.col.ar .lab{background:#6a1b9a}
.col p,.col ul,.col h3{margin-left:8px!important;margin-right:8px!important}
.col table{width:calc(100% - 16px);margin:10px 8px;font-size:18px}
.col .cols{margin:10px 8px}
.col .chips{margin:6px 8px!important}
.col{font-size:20px}
.ph small{display:block;font-size:20px;font-weight:600;opacity:.95;direction:rtl}
@media(max-width:900px){.dual{grid-template-columns:1fr}}
.pair{margin:10px 0}
.pair .e{font-weight:700;font-size:23px;line-height:1.8}
.pair .a{color:#4a148c;background:#f6edff;border-inline-start:6px solid #ab47bc;padding:4px 14px;border-radius:12px;margin-top:4px;font-size:21px;line-height:1.9}
.pair.li .e{padding-inline-start:6px}
.hh{background:linear-gradient(90deg,#e3f2fd,#fff);border-radius:14px;padding:6px 14px!important;margin-top:18px!important}
.hh>span:first-child{display:block}

<body>
<header>
 <div class="logo" id="logo"></div>
 <h1>Lesson 4: Ethical Issues with AI<small>الدرس الرابع: القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي — الصف الثاني الثانوي</small></h1>
</header>
<main id="app"></main>
<div id="modal" class="hidden"></div>
<script>
/* ===== Simple paragraph-by-paragraph bilingual lesson ===== */
const p=(e,a)=>['p',e,a], li=(e,a)=>['li',e,a], h=(e,a)=>['h',e,a], box=(c,t,items)=>['box',c,t,items];
function pair(e,a,c=''){return `<div class="pair ${c}"><div class="e" dir="ltr">${e}</div><div class="a" dir="rtl">${a}</div></div>`}
function r1(x){switch(x[0]){
 case 'h':return `<h3 class="hh"><span dir="ltr">${x[1]}</span><span class="tr" dir="rtl">${x[2]}</span></h3>`;
 case 'p':return pair(x[1],x[2]);
 case 'li':return pair('➤ '+x[1],'➤ '+x[2],'li');
 case 'box':return `<div class="box ${x[1]}"><h3>${x[2][0]}<span class="tr" dir="rtl">${x[2][1]}</span></h3>${x[3].map(r1).join('')}</div>`;
 case 'chips':return `<div class="chips" style="margin:6px 24px">${x[1].map(c=>`<span>${c[0]}<small style="display:block;font-size:15px;color:#6a1b9a" dir="rtl">${c[1]}</small></span>`).join('')}</div>`;
 case 'pr':return `<div class="cols">${[['⚖️','Fairness','العدالة','Treat everyone equally, no unjust discrimination','عدم التمييز ظلمًا ضد أي شخص أو مجموعة','p1'],['👁️','Transparency','الشفافية','Show clearly how the AI decides and works','إظهار طريقة اتخاذ القرار وآلية العمل بوضوح','p2'],['🔒','Privacy protection','حماية الخصوصية','Handle personal information properly','التعامل مع المعلومات الشخصية بشكل مناسب','p3'],['✅','Accountability','المساءلة','Be answerable for the AI\'s decisions','تحديد المسؤول الذي يمكن محاسبته على قرارات النظام','p4']].map(c=>`<div class="pr ${c[5]}"><b>${c[0]}</b>${c[1]}<small>${c[3]}</small><small dir="rtl" style="margin-top:4px">${c[2]}: ${c[4]}</small></div>`).join('')}</div>`;
 case 'table':return `<table>${x[1].map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${c[0]}<span class="tr" dir="rtl">${c[1]}</span></${i?'td':'th'}>`).join('')}</tr>`).join('')}</table>`;
}}
const LESSON=[
{t:['🗺️ Lesson Map: What are we learning?','🗺️ خريطة الدرس: ماذا سنتعلم؟'],b:[
 box('obj',['🎯 Learning Objectives','🎯 أهداف التعلم'],[
  li('Explain what algorithmic bias is and what causes it.','اشرح ما هو التحيز الخوارزمي وما أسبابه الرئيسية.'),
  li('Connect the four principles of AI ethics (fairness, transparency, privacy protection, accountability) to real situations.','اربط المبادئ الأربعة لأخلاقيات الذكاء الاصطناعي (العدالة، الشفافية، حماية الخصوصية، المساءلة) بمواقف حقيقية.'),
  li('Judge an ethical situation about AI, justify a rule for responsible use, and name who is responsible.','قيّم موقفًا أخلاقيًا يتعلق بالذكاء الاصطناعي، وبرّر قاعدة للاستخدام المسؤول، وحدد الأطراف المسؤولة.')]),
 box('ex',['🤔 Why do we study this?','🤔 لماذا ندرس هذا الدرس؟'],[
  p('AI now helps make real decisions about people: choosing job candidates, recognizing faces, and deciding how personal data is used.','أصبح الذكاء الاصطناعي يساعد في قرارات حقيقية تخص الناس: اختيار المتقدمين للوظائف، والتعرف على الوجوه، وتحديد كيفية استخدام البيانات الشخصية.'),
  p('But an AI can be unfair if the data it learned from was biased, and it can be hard to know why it made a decision.','لكن الذكاء الاصطناعي قد يكون غير عادل إذا كانت البيانات التي تعلّم منها متحيزة، وقد يصعب أن نعرف لماذا اتخذ قرارًا معينًا.')]),
 box('think',['❓ Guiding question','❓ السؤال الرئيسي'],[p('What ethical issues arise as AI spreads, and what principles should guide how we use it?','ما القضايا الأخلاقية التي تنشأ مع انتشار الذكاء الاصطناعي، وما المبادئ التي ينبغي أن توجه استخدامنا له؟')]),
 h('The 4 questions we ask about any AI','أربعة أسئلة نسألها عن أي ذكاء اصطناعي'),
 li('⚖️ Fairness → Does it treat everyone fairly?','⚖️ العدالة ← هل يعامل الجميع بشكل عادل؟'),
 li('🔍 Transparency → Can we understand why it decided?','🔍 الشفافية ← هل يمكن فهم سبب القرار؟'),
 li('🔒 Privacy → Is personal data protected?','🔒 الخصوصية ← هل يتم حماية البيانات الشخصية؟'),
 li('🙋 Accountability → Who is responsible for the results?','🙋 المساءلة ← من الطرف المسؤول عن النتائج؟'),
 h('🔑 Key Concepts','🔑 المفاهيم الأساسية'),
 ['chips',[['algorithmic bias','التحيز الخوارزمي'],['training data','بيانات التدريب'],['face recognition','التعرف على الوجه'],['privacy','الخصوصية'],['explainable AI (XAI)','الذكاء الاصطناعي القابل للتفسير'],['black-box problem','مشكلة الصندوق الأسود'],['responsibility','المسؤولية'],['fairness','العدالة'],['transparency','الشفافية'],['privacy protection','حماية الخصوصية'],['accountability','المساءلة']]],
 box('key',['💡 The Big Idea (Key Fact)','💡 الفكرة الأساسية'],[p('If the training data is biased, an AI can copy that bias in its judgments. Using AI responsibly means: ① checking for bias, ② being able to explain decisions, ③ knowing who is accountable.','إذا كانت بيانات التدريب متحيزة، يمكن للذكاء الاصطناعي أن يكرر هذا التحيز في أحكامه. والاستخدام المسؤول يعني: ① التحقق من التحيز، ② القدرة على شرح القرارات، ③ معرفة من هو المسؤول.')]),
 box('think',['🧑‍🤝‍🧑 Explore · In Pairs','🧑‍🤝‍🧑 استكشف (في ثنائيات)'],[p('With a partner: a face-recognition AI is more likely to misidentify people from some ethnic groups than others. Before you read on, predict who could be harmed and how. Give a reason.','مع زميل: ذكاء اصطناعي للتعرف على الوجه أكثر عرضة لإساءة التعرف على أشخاص من بعض المجموعات العرقية مقارنةً بغيرها. قبل أن تكمل القراءة، توقع من قد يتضرر وكيف، واذكر سببًا.')])
]},

{t:['1️⃣ Algorithmic Bias','1️⃣ التحيز الخوارزمي'],q:1,b:[
 box('term',['📌 Key Term: Algorithmic bias','📌 مصطلح: التحيز الخوارزمي'],[p('Algorithmic bias = bias in AI judgments caused by bias in the training data. It is a pattern in the AI\'s results that can be unfair or harmful.','التحيز الخوارزمي = نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وقد ينشأ من البيانات أو تصميم النظام أو طريقة استخدامه أو السياق البشري والاجتماعي.')]),
 box('term',['📌 Key Term: Training data','📌 مصطلح: بيانات التدريب'],[p('Training data = the examples an AI learns from before it is used. The less they represent real life, the more likely its results are biased.','بيانات التدريب = الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه. وكلما قلّ تمثيلها للواقع زاد احتمال تحيّز مخرجاته.')]),
 box('ex',['🧒 In simple words','🧒 بكلمات بسيطة'],[p('Think of an AI as a student who learns only from the examples the teacher gives. If the examples are unfair or incomplete, the student\'s answers will be unfair too.','تخيل الذكاء الاصطناعي كطالب يتعلم فقط من الأمثلة التي يعطيها له المعلم. إذا كانت الأمثلة غير عادلة أو ناقصة، ستكون إجاباته غير عادلة أيضًا.')]),
 h('Examples of algorithmic bias','أمثلة على التحيز الخوارزمي'),
 li('A hiring AI that unfairly evaluates a particular gender.','نظام توظيف يفضّل فئة أو يقيّم جنسًا معينًا بصورة غير عادلة.'),
 li('A face-recognition AI that is more likely to misidentify particular ethnic groups (its accuracy is lower for some groups).','نظام تعرف على الوجه أكثر عرضة لإساءة التعرف على مجموعات عرقية معينة (تقل دقته مع فئات معينة).'),
 h('Main causes of bias','الأسباب الرئيسية للتحيز'),
 box('warn',['① Biased training data','① بيانات التدريب المتحيزة'],[
  p('Training data = the data the AI learns from. It can be biased in two ways:','بيانات التدريب هي البيانات التي يتعلم منها النظام. ويمكن أن تكون متحيزة بطريقتين:'),
  li('(a) Not enough data about certain groups. Example: a face system trained on a huge number of photos of one group and very few photos of another becomes more accurate with the first group and less accurate with the second. Not enough data → poor learning → unfair results.','(أ) بيانات غير كافية عن سمات معينة. مثال: نظام تعرف على الوجه تم تدريبه على عدد كبير جدًا من صور فئة معينة وعدد قليل جدًا من صور فئة أخرى، فيصبح أكثر دقة مع الأولى وأقل دقة مع الثانية. بيانات غير كافية ← تعلّم غير جيد ← نتائج غير عادلة.'),
  li('(b) Past discrimination is reflected in the data. Example: a company in the past, because of unfair human practices, chose one type of applicant more than others. If an AI is trained on that old hiring data, it may learn "people from this group are the best" and keep preferring them.','(ب) انعكاس نزعات تمييزية سابقة في البيانات. مثال: شركة كانت في الماضي، بسبب ممارسات بشرية غير عادلة، تختار نوعًا معينًا من المتقدمين أكثر من غيرهم. إذا تدرّب الذكاء الاصطناعي على هذه البيانات القديمة فقد يتعلم أن «هذه الفئة هي الأفضل» ويستمر في تفضيلها.'),
  p('⚠️ The problem is not that the AI hates a group. It learned an unfair pattern that already exists in the data.','⚠️ المشكلة ليست أن الذكاء الاصطناعي يكره فئة معينة، لكنه تعلّم نمطًا غير عادل موجودًا بالفعل في البيانات.')]),

{t:['3️⃣ Explainable AI (XAI) and Responsibility','3️⃣ الذكاء الاصطناعي القابل للتفسير (XAI) والمسؤولية'],q:3,b:[

  p('Example: a company uses AI to choose job applicants. The system says "This person is not suitable." We want to know why: experience? qualification? skills? If the system can show the factors behind its decision, it is called XAI.','مثال: شركة تستخدم الذكاء الاصطناعي لاختيار المتقدمين. قال النظام: «هذا الشخص غير مناسب للوظيفة». نريد أن نعرف لماذا: الخبرة؟ المؤهل؟ المهارات؟ إذا استطاع النظام توضيح العوامل التي أدت إلى القرار فهذا يسمى XAI.'),

 box('think',['⏸️ Pause & Think','⏸️ توقف وفكر'],[p('If no one can explain why an AI rejected someone\'s job application, is that fair? Which principle of AI ethics is missing?','إذا لم يستطع أحد شرح سبب رفض الذكاء الاصطناعي لطلب توظيف شخص ما، فهل هذا عادل؟ أي مبدأ من مبادئ أخلاقيات الذكاء الاصطناعي مفقود؟')])

const OPEN=[
{ar:{q:`🧑‍🤝‍🧑 استكشف (في ثنائيات): ذكاء اصطناعي للتعرف على الوجه أكثر عرضة لإساءة التعرف على أشخاص من بعض المجموعات العرقية مقارنةً بغيرها. توقع من قد يتضرر من هذا وكيف. اذكر سببًا.`,a:`قد يتضرر أفراد المجموعات التي يخطئ النظام في التعرف عليها أكثر؛ فقد يُشتبه بهم خطأً أو يُمنعون من خدمة أو يُعاملون بغير عدل. والسبب أن بيانات التدريب قد تحتوي على صور قليلة منهم فتقل دقة النظام معهم. (توجد أكثر من إجابة مقبولة).`},
 en:{q:`🧑‍🤝‍🧑 Explore (in pairs): A face-recognition AI is more likely to misidentify people from some ethnic groups than others. Predict who could be harmed and how. Give a reason.`,a:`People from the groups the system misidentifies more often could be harmed: they might be wrongly suspected, denied a service, or treated unfairly. A likely reason is that the training data had fewer images of them, so the system is less accurate for them. (More than one reasonable answer is possible.)`}},
{ar:{q:`🛑 توقف وفكر: عند استخدام تقنية التعرف على الوجه في الأماكن العامة، قد تتحسن السلامة والراحة، لكن تنشأ أيضًا مخاوف بشأن الخصوصية. اشرح كيف ينبغي الموازنة بين الراحة والسلامة وحماية الخصوصية، واذكر أي مبدأ أساسي من مبادئ أخلاقيات الذكاء الاصطناعي يرتبط ارتباطًا وثيقًا برأيك.`,a:`ينبغي استخدام التقنية في حالات ضرورية وبحدود واضحة، مع إعلام الناس بوجود الكاميرات، وجمع أقل قدر من البيانات وحمايتها وعدم استخدامها لغير الغرض المعلن. المبدأ الأقرب: حماية الخصوصية (ويمكن ذكر الشفافية أو المساءلة بحسب رأيك مع التبرير).`},
 en:{q:`🛑 Think It Through: When face-recognition technology is used in public spaces, safety and convenience may improve, but privacy concerns also arise. Explain how convenience, safety, and privacy protection should be balanced, and state which basic principle of AI ethics is most closely related to your view.`,a:`The technology should be used only where necessary and within clear limits, people should be told that cameras are in use, as little data as possible should be collected, protected, and never used for a different purpose. Closest principle: privacy protection (transparency or accountability can also be argued with a reason).`}},
{ar:{q:`🛑 توقف وفكر: إذا لم يستطع أحد شرح سبب رفض الذكاء الاصطناعي لطلب توظيف شخص ما، فهل هذا عادل؟ أي مبدأ من مبادئ أخلاقيات الذكاء الاصطناعي مفقود؟`,a:`ليس عادلًا؛ لأنه يصعب اكتشاف الخطأ أو التحيز إذا لم يُشرح سبب القرار. المبدأ المفقود هو الشفافية (ومعها القابلية للتفسير XAI).`},
 en:{q:`⏸️ Pause & Think: If no one can explain why an AI rejected someone's job application, is that fair? Which principle of AI ethics is missing?`,a:`It is not fair, because without an explanation it is hard to detect mistakes or bias. The missing principle is transparency (supported by explainable AI, XAI).`}},
{ar:{q:`📝 سؤال على نمط الامتحان [٦ درجات]: حلّل كيف يمكن أن ينشأ التحيز الخوارزمي في نظام ذكاء اصطناعي، وكيف يمكن تقليله. في إجابتك، أشر إلى سبب التحيز (بيانات تدريب متحيزة أو غير كافية) وإلى كيفية مساعدة مبدأي العدالة والشفافية في معالجته.`,a:`ينشأ التحيز عندما تكون بيانات التدريب متحيزة أو غير كافية عن فئات معينة، أو تعكس تمييزًا سابقًا، وقد يدخل أيضًا من اختيار المتغيرات أو تصميم النموذج أو طريقة الاستخدام. يمكن تقليله بتطبيق مبدأ العدالة: فحص مدى تمثيل البيانات واختبار النتائج عبر فئات مختلفة وتصحيح الاختلالات؛ وبتطبيق مبدأ الشفافية: إتاحة معلومات واضحة عن كيفية اتخاذ القرار حتى يمكن اكتشاف التحيز والأخطاء ومراجعتها، مع تحديد من المسؤول عن التصحيح.`},
 en:{q:`📝 Exam-style question [6]: Analyze how algorithmic bias can arise in an AI system, and how it can be reduced. In your answer: refer to the cause of bias (biased or insufficient training data) and to how the principles of fairness and transparency help address it.`,a:`Bias arises when training data is biased or insufficient about certain groups, or reflects past discrimination; it can also enter through the choice of variables, the model design, or the way the system is used. It can be reduced by applying fairness: checking how well the data represents groups, testing results across different groups, and correcting imbalances; and by applying transparency: giving clear information about how decisions are made so bias and errors can be detected and reviewed, and deciding who is responsible for correcting them.`}},
{ar:{q:`⚙️ فكّر كمهندس — ابحث ثم قرر: ① استقصِ: ابحث عن حالة موثقة اتُّهم فيها نظام ذكاء اصطناعي بإنتاج نتائج غير عادلة أو متحيزة، وسجل المصدر. ما الفئة التي تأثرت؟ وما العوامل في البيانات أو تصميم النظام أو استخدامه؟ ② اعتبر المسؤولية: من المسؤول — المطوّر، أم الشركة التي تستخدمه، أم المشغّل؟ دوّن مسؤولية كل منهم. ③ قرر: ما القاعدة الواحدة التي ينبغي أن تتبعها شركة تستخدم ذكاءً اصطناعيًا للتوظيف لجعل النظام أكثر عدالة؟ برّر قاعدتك بمبادئ أخلاقيات الذكاء الاصطناعي. (تلميح: افحص مدى تمثيل البيانات، ثم اختبر النتائج عبر فئات مختلفة.)`,a:`① مثال معروف: أداة توظيف تجريبية في شركة كبرى أعطت تقييمًا أقل للمتقدمات بسبب تدريبها على سير ذاتية سابقة أغلبها لرجال (اختر مصدرك وسجله). ② المطوّر مسؤول عن التصميم والاختبار، والشركة المشغلة عن حسن الاستخدام والمراجعة البشرية، والمستخدم عن اتباع التعليمات؛ ولا يوجد توزيع واحد يصلح لكل الحالات. ③ قاعدة مقترحة: «لا يُستخدم النظام قبل اختبار نتائجه عبر الجنسين والفئات المختلفة وتصحيح أي فروق»، وتبريرها بمبدأ العدالة، مع الشفافية لتوضيح أسباب القرار.`},
 en:{q:`⚙️ Think as an Engineer — Investigate & Decide: 1 Investigate: find one documented case where an AI system was accused of being unfair or biased and record your source. What group did it affect, and what data might have caused it? 2 Consider responsibility: who is responsible — the developer, the company using it, or the operator? Note each one's responsibility. 3 Decide: before a company uses a hiring AI, what one rule should it follow to make the system fairer? Justify your rule using the principles of AI ethics. (Stuck? Check the data and test the AI's results across different groups.)`,a:`1 A well-known example: an experimental hiring tool at a large company rated women lower because it was trained on past résumés that were mostly from men (choose and record your own source). 2 The developer is responsible for design and testing; the company using it for proper use and human review; the user for following the rules; there is no single distribution that fits every case. 3 Suggested rule: "Do not use the system until its results have been tested across genders and other groups and any gap is corrected" — justified by fairness, with transparency to explain decisions.`}},
{ar:{q:`🌍 طبّق ما تعلمته: ترغب مدرسة في استخدام كاميرات التعرف على الوجه عند بوابتها لتسجيل الحضور تلقائيًا. حدد فائدة عملية واحدة للمدرسة ومصدر قلق واحد يتعلق بالخصوصية. ثم، إذا أخطأت الكاميرا في التعرف على طالب، من ينبغي أن يكون مسؤولًا — المدرسة، أم الشركة التي صنعت الذكاء الاصطناعي؟ اذكر سببًا.`,a:`الفائدة: توفير وقت تسجيل الحضور. القلق: تخزين صور الطلاب وبياناتهم وتتبع حركتهم دون موافقة أو حماية كافية. المسؤولية: يمكن القول إن المدرسة مسؤولة لأنها اختارت النظام وتشغّله وتحمي بيانات طلابها، ويمكن القول إن الشركة مسؤولة عن تصميم واختبار النظام جيدًا؛ والأقرب أن المسؤولية مشتركة بحسب الدور (توجد أكثر من إجابة مقبولة مع التبرير).`},
 en:{q:`🌍 In a New Context: A school wants to use face-recognition cameras at its gate to record attendance automatically. Identify one practical benefit for the school and one privacy concern. Then, if the camera misidentifies a student, who should be responsible — the school, or the company that made the AI? Give a reason.`,a:`Benefit: saves time when recording attendance. Concern: students' photos and data could be stored and their movements tracked without consent or enough protection. Responsibility: the school can be held responsible because it chose and runs the system and protects student data; the company is responsible for designing and testing it well; most reasonably the responsibility is shared according to each role (more than one answer is acceptable with a reason).`}},
{ar:{q:`💭 فكّر: وُجد أن ذكاءً اصطناعيًا للتوظيف يقيّم المتقدمين من جنس معين بدرجة أقل. باستخدام أفكار التحيز الخوارزمي والمبادئ الأساسية لأخلاقيات الذكاء الاصطناعي، اشرح السبب الأرجح وإجراءً واحدًا ممكنًا لمعالجته. (قد توجد أكثر من وجهة نظر معقولة.)`,a:`السبب الأرجح: تدريب النظام على بيانات توظيف سابقة تعكس تفضيلًا لجنس معين أو وجود متغير بديل يمثل الجنس بشكل غير مباشر. الإجراء: فحص البيانات وتوازنها واختبار النتائج عبر الجنسين (العدالة)، وتوضيح أسباب القرار (الشفافية/XAI)، ومراجعة بشرية مع تحديد المسؤول (المساءلة).`},
 en:{q:`💭 Think It Through: A hiring AI was found to rate applicants of a particular gender lower. Using the ideas of algorithmic bias and the basic principles of AI ethics, explain the most likely cause and one possible measure to address it. There can be more than one reasonable view. Give the basis for your answer.`,a:`Most likely cause: the system was trained on past hiring data that reflects a preference for one gender, or it uses a proxy variable that indirectly stands in for gender. Measure: check and balance the data and test results across genders (fairness), explain the reasons for decisions (transparency/XAI), and add human review with a named responsible party (accountability).`}},
{ar:{q:`⭐ تأمل وتحدَّ نفسك: هل غيّر هذا الدرس مدى ثقتك في قرار يتخذه الذكاء الاصطناعي بشأنك؟ أي من المبادئ الأربعة تعتقد أنه الأصعب ضمانًا، ولماذا؟ ثم اختر مكانًا واحدًا يُستخدم فيه الذكاء الاصطناعي (التوظيف، أو التعرف على الوجه، أو التوصيات)، واقترح قاعدة واحدة مبنية على مبادئ أخلاقيات الذكاء الاصطناعي من شأنها أن تجعله أكثر جدارة بالثقة.`,a:`إجابة حرة تعبّر عن رأيك مع السبب. مثال: الشفافية قد تكون الأصعب لأن بعض النماذج معقدة ويصعب تفسيرها. قاعدة مقترحة للتوصيات: «أن يعرف المستخدم لماذا ظهرت له التوصية وأن يستطيع إيقاف جمع بياناته» (الشفافية وحماية الخصوصية).`},
 en:{q:`⭐ Reflect & Challenge: Has this lesson changed how much you would trust an AI decision about you? Which of the four principles do you think is hardest to guarantee, and why? Then choose one place AI is used (hiring, face recognition, or recommendations) and suggest one rule based on the AI ethics principles that would make it more trustworthy.`,a:`A free answer giving your own view with a reason. Example: transparency may be hardest because some models are complex and hard to explain. Suggested rule for recommendations: "Users must be told why an item was recommended and be able to stop their data from being collected" (transparency and privacy protection).`}}
];

const EFAR={

ew1d:[`(١) د: عندما يتخذ الذكاء الاصطناعي حكمًا خاطئًا، فإن من هو المسؤول قد تم تحديده بوضوح بالفعل.`],
ew2a:[MQ+`أ. عدم التمييز ظلمًا ضد أي شخص أو مجموعة بعينها`],
ew2b:[MQ+`ب. إظهار عملية اتخاذ القرار في الذكاء الاصطناعي وآلياته الداخلية بوضوح`],
ew2c:[MQ+`ج. التعامل مع المعلومات الشخصية بشكل مناسب وحماية الخصوصية`],
ew2d:[MQ+`د. أن يكون الشخص مسؤولًا أمام الآخرين (قابلًا للمساءلة) عن قرارات الذكاء الاصطناعي`],
et1_1:[`تدرب ١-١: ما المصطلح الذي يصف الظاهرة التي ينشأ فيها تحيز في أحكام الذكاء الاصطناعي بسبب تحيز في بيانات التدريب؟`,,[`التحيز الخوارزمي`,`تحيز خوارزمي`]],
et1_2:[`تدرب ١-٢: ما المصطلح الخاص بالتقنية التي تتيح للبشر فهم سبب اتخاذ الذكاء الاصطناعي حكمًا معينًا؟ واذكر أيضًا اختصارها المكون من ثلاثة أحرف.`,,[`الذكاء الاصطناعي القابل للتفسير`,`xai`]],
et1_3:[`تدرب ١-٣: من بين المبادئ الأساسية لأخلاقيات الذكاء الاصطناعي، ما المصطلح الخاص بالمبدأ الذي يقتضي عدم التمييز ظلمًا ضد أي شخص أو مجموعة بعينها؟`,,[`العدالة`]],
et1_4:[`تدرب ١-٤: من بين المبادئ الأساسية لأخلاقيات الذكاء الاصطناعي، ما المصطلح الخاص بالمبدأ الذي يقتضي التعامل مع المعلومات الشخصية بشكل مناسب؟`,,[`حماية الخصوصية`]],
et2a:[`تدرب ٢ (١): من بين الخيارات التالية (أ–د)، اختر الخيار الذي ليس سببًا مناسبًا للتحيز الخوارزمي.`,[`بيانات التدريب متحيزة.`,`انعكاس نزعات تمييزية سابقة في البيانات.`,`سرعة معالجة الحاسوب بطيئة.`,`هناك بيانات غير كافية عن سمات معينة.`]],
et2b:[`تدرب ٢ (٢): من بين الخيارات التالية (أ–د)، اختر كل ما يمثل قضايا خصوصية مرتبطة بالذكاء الاصطناعي.`,[`يتم التعرف على الأفراد وتتبعهم من خلال تقنية التعرف على الوجه.`,`تُجمع بيانات السلوك عبر الإنترنت وتُحلَّل بكميات كبيرة.`,`الذكاء الاصطناعي ينشئ أعمالًا إبداعية.`,`تتحسن سرعة حوسبة الذكاء الاصطناعي.`]],
ee2a:[`تمرين ٢: اقرأ الفقرة واملأ الفراغ (أ):<br><small>${PASA}</small>`,,[`التحيز الخوارزمي`,`تحيز خوارزمي`]],
ee2b:[`تمرين ٢: اقرأ الفقرة واملأ الفراغ (ب):<br><small>${PASA}</small>`,,[`الذكاء الاصطناعي القابل للتفسير`,`xai`]],
ee2c:[`تمرين ٢: اقرأ الفقرة واملأ الفراغ (ج):<br><small>${PASA}</small>`,,[`المسؤولية`]],
ee3a:[`تمرين ٣ (١): أي مبدأ أساسي من مبادئ أخلاقيات الذكاء الاصطناعي يرتبط وثيقًا بـ: أ. ضمان أن يقيّم ذكاء اصطناعي للتوظيف بعدالة بغض النظر عن الجنس.`],
ee3b:[`تمرين ٣ (١): أي مبدأ أساسي من مبادئ أخلاقيات الذكاء الاصطناعي يرتبط وثيقًا بـ: ب. الإفصاح عن عملية اتخاذ القرار في الذكاء الاصطناعي للمستخدمين بطريقة سهلة الفهم.`],
ee3c:[`تمرين ٣ (١): أي مبدأ أساسي من مبادئ أخلاقيات الذكاء الاصطناعي يرتبط وثيقًا بـ: ج. عدم استخدام البيانات الشخصية المجمّعة لأغراض غير الغرض الأصلي منها.`],
ee3d:[`تمرين ٣ (١): أي مبدأ أساسي من مبادئ أخلاقيات الذكاء الاصطناعي يرتبط وثيقًا بـ: د. أن يكون الشخص مسؤولًا أمام الآخرين عندما تتبين خطأ نتيجة تشخيصية صادرة عن الذكاء الاصطناعي.`],
ee3q:[`تمرين ٣ (٢): من بين الخيارات التالية (أ–د)، اختر الخيار الذي يصف بشكل أنسب القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي.`,[`لا توجد قضايا أخلاقية متعلقة بالذكاء الاصطناعي.`,`التحيز الخوارزمي ناتج عن سرعة معالجة الذكاء الاصطناعي.`,`يمكن أن يتسبب التحيز في بيانات التدريب في تحيز تمييزي في أحكام الذكاء الاصطناعي.`,`حتى لو كانت عملية اتخاذ القرار في الذكاء الاصطناعي غير شفافة، فلا توجد مشكلة للمستخدمين.`]]
};
EF.forEach(q=>{const t=EFAR[q.id];let o=t[1];if(!o)o=q.t==='tf'?TF.ar:(q.en.o===PE?PA:null);q.ar={q:t[0],o:o};if(q.t==='txt')q.a.ar=t[2]});

/* floating background emojis */
['🤖','⚖️','🔒','💡','🧠','👁️','✅','💻','🔍','📊'].forEach((e,i)=>{const s=document.createElement('div');s.className='fl';s.textContent=e;s.style.left=(5+i*9.5)+'%';s.style.animationDuration=(14+i*2.2)+'s';s.style.animationDelay=(-i*2.5)+'s';document.body.appendChild(s)});

/* sound + visual effects */
let ac;
function beep(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function sfx(ok){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const n=ac.currentTime;if(ok){[523,659,784,1047,1319].forEach((f,k)=>beep(f,n+k*.09,.22,'triangle',.25))}else{beep(220,n,.3,'sawtooth',.2);beep(150,n+.25,.45,'sawtooth',.2)}}catch(e){}}
function burst(ok){const set=ok?['🎉','⭐','✨','🎊','😀','👏','🌟']:['😢','❌','💔','😞'];for(let i=0;i<(ok?26:10);i++){const s=document.createElement('div');s.className='em';s.textContent=set[i%set.length];s.style.left=(10+Math.random()*80)+'vw';s.style.top=(ok?50+Math.random()*30:40+Math.random()*30)+'vh';s.style.setProperty('--dy',(ok?-(200+Math.random()*250):120+Math.random()*120)+'px');s.style.setProperty('--dx',((Math.random()-.5)*300)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}}

/* text normalization */
function nz(s){return String(s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[()\[\].,،:؛;!?؟"'«»\-–—_]/g,' ').replace(/(^|\s)ال/g,'$1').replace(/\s+/g,' ').trim()}

 let h=`<button class="back" onclick="home()">⬅ Home · الرئيسية</button>`;
 LESSON.forEach((p,i)=>{
  h+=`<section class="card" dir="ltr"><div class="ph c${i%5}">${p.t[0]}<small>${p.t[1]}</small></div>${p.b.map(r1).join('')}`;

 });

function pick(bank,ids){return ids.map(id=>bank.find(x=>x.id===id))}
function partQ(src,n){
 runQuiz({list:pick(src==='ef'?EF:AR,src==='ef'?PARTS.en[n]:PARTS.ar[n]),title:`Part ${n} — 5 Questions · الجزء ${n}`,exam:false});
}

/* exams with name entry */

 const T=src==='ef'?'Lesson 4 Exam — English Book · اختبار الملف الإنجليزي':'Lesson 4 Exam — Arabic Book · اختبار الملف العربي';
 modal.classList.remove('hidden');document.body.style.overflow='hidden';

/* quiz engine (English + Arabic translation) */
function ansHTML(it){
 const en=it.en,ar=it.ar;let e,a;
 if(it.t==='txt'){e=it.a.en[0];a=it.a.ar[0]}
 else if(it.t==='multi'){e=it.a.map(i=>EL[i]+') '+en.o[i]).join(' / ');a=it.a.map(i=>AL[i]+') '+ar.o[i]).join(' / ')}
 else{e=EL[it.a]+') '+en.o[it.a];a=AL[it.a]+') '+ar.o[it.a]}
 return `${e}<span class="tr" dir="rtl">${a}</span>`;
}
function runQuiz(o){
 const {list,title,exam}=o;
 let i=0,score=0;
 modal.classList.remove('hidden');document.body.style.overflow='hidden';modal.scrollTop=0;
 function show(){
  if(i>=list.length)return end();
  const it=list[i],en=it.en,ar=it.ar;let locked=false,sel=new Set();
  let body='';
  if(it.t==='txt')body=`<input id="ti" class="txt" dir="auto" autocomplete="off" placeholder="Type your answer (English or Arabic) · اكتب إجابتك"><div class="qbtns"><button class="bigbtn g" id="ck">✔ Check answer · تأكيد</button></div>`;
  else{
   body=en.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="ot">${it.t==='tf'?'':`<b>${EL[k]}</b>`}${t}</span><span class="tr" dir="rtl" style="${it.t==='tf'?'margin-inline-start:0':''}">${ar.o[k]}</span></button>`).join('');
   if(it.t==='multi')body+=`<div class="qbtns"><button class="bigbtn g" id="ck">✔ Check answer · تأكيد الإجابة</button></div>`;
  }
  modal.innerHTML=`<div class="mbox" dir="ltr" id="mb"><button class="x" onclick="closeM()">✖</button>
  <div class="mt">${title}</div>${exam?`<div style="font-size:19px">👤 ${NAME}</div>`:''}
  <div class="meta"><span>Question ${i+1} / ${list.length} · سؤال</span><span>⭐ ${score}</span></div>
  <div class="pbar"><i style="width:${(i/list.length)*100}%"></i></div>
  <div class="qq">${en.q}<span class="tr" dir="rtl">${ar.q}</span></div>${body}<div class="fb" id="fb"></div>
  <div class="qbtns"><button class="bigbtn b" id="nx" style="display:none">${i+1<list.length?'Next ➡ التالي':'🏁 Result · النتيجة'}</button></div></div>`;
  const fb=$('#fb'),mb=$('#mb'),nx=$('#nx');
  function done(ok){
   locked=true;if(ok)score++;sfx(ok);burst(ok);
   mb.classList.add(ok?'pulse':'shake');
   fb.className='fb '+(ok?'ok':'no');
   fb.innerHTML=ok?`🎉😀 Excellent! Correct answer<span class="tr" dir="rtl" style="color:#1b5e20">ممتاز! إجابة صحيحة</span>`:`😢 Wrong answer — the correct answer is:<br>${ansHTML(it)}<span class="tr" dir="rtl" style="color:#b71c1c">إجابة خاطئة — الإجابة الصحيحة موضحة أعلاه</span>`;
   if(it.t==='txt')$('#ti').disabled=true;
   const c=$('#ck');if(c)c.style.display='none';
   nx.style.display='inline-block';nx.focus();
  }
  if(it.t==='txt'){
   const accs=[...it.a.en,...it.a.ar];
   const chk=()=>{if(locked)return;const v=nz($('#ti').value);if(!v)return;done(accs.some(a=>{const n=nz(a);return v===n||(n.length>=3&&v.includes(n))}))};
   $('#ck').onclick=chk;$('#ti').onkeydown=e=>{if(e.key==='Enter')chk()};$('#ti').focus();
  }else if(it.t==='multi'){
   document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('sel')});
   $('#ck').onclick=()=>{if(locked||!sel.size)return;const ok=sel.size===it.a.length&&it.a.every(k=>sel.has(k));
    document.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('sel');if(it.a.includes(k))b.classList.add('right');else if(sel.has(k))b.classList.add('bad')});done(ok)};
  }else{
   document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const k=+b.dataset.k;const ok=k===it.a;
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===it.a)x.classList.add('right')});
    if(!ok)b.classList.add('bad');done(ok)});
  }
  nx.onclick=()=>{i++;show()};
 }
 function end(){
  const n=list.length,pct=Math.round(score/n*100);
  const em=pct>=90?'🏆':pct>=75?'🎉':pct>=50?'🙂':'😢';
  const msg=pct>=90?['Outstanding! You are a pro!','ممتاز! أنت محترف!']:pct>=75?['Great job!','أحسنت! عمل رائع']:pct>=50?['Good — review the lesson and try again','جيد، راجع الدرس وحاول مرة أخرى']:['Keep going — review the lesson and try again','لا بأس، راجع الدرس وحاول مرة أخرى'];
  sfx(pct>=50);burst(pct>=50);
  const date=new Date().toLocaleString('en-GB');
  modal.innerHTML=`<div class="mbox res" dir="ltr"><button class="x" onclick="closeM()">✖</button><div class="mt" style="margin:0">${title}</div>
  <div class="big">${em}</div>${exam?`<p>👤 ${NAME}</p>`:''}<div class="sc">${score} / ${n} &nbsp;(${pct}%)</div><p>${msg[0]}<span class="tr" dir="rtl">${msg[1]}</span></p>
  <div class="qbtns">${exam?`<button class="bigbtn g" id="wa">📲 Send result to WhatsApp · إرسال النتيجة</button>`:''}
  <button class="bigbtn b" id="rt">🔁 Try again · إعادة</button><button class="bigbtn o" onclick="closeM()">Close · إغلاق</button></div></div>`;
  $('#rt').onclick=()=>{i=0;score=0;show()};
  if(exam)$('#wa').onclick=()=>{
   const t=`*منصة محترف | Mohtarf*\n📘 ${title}\n👤 Student / الطالب: ${NAME}\n⭐ Score / النتيجة: ${score} / ${n} (${pct}%)\n📅 ${date}`;
   window.open('https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(t),'_blank');
  };
 }
 show();
}

/* open / thinking questions */
function openQ(){
 let h=`<button class="back" onclick="home()">⬅ الرئيسية · Home</button><div class="hero"><h2>💭 أسئلة التفكير والمقال</h2><p>Thinking &amp; essay questions — اكتب إجابتك ثم اضغط لعرض الإجابة النموذجية</p></div>`;
 OPEN.forEach((o,i)=>{
  h+=`<section class="card"><div class="ph c${i%5}">${i+1}</div><div class="lang2" style="margin:0 24px"><div dir="rtl"><p style="margin:0">${o.ar.q}</p></div><div dir="ltr"><p style="margin:0">${o.en.q}</p></div></div>
  <div style="margin:10px 24px"><textarea class="ota" placeholder="اكتب إجابتك · Write your answer"></textarea>
  <div class="qbtns"><button class="bigbtn g" onclick="this.parentNode.nextElementSibling.classList.toggle('hidden')">👁 الإجابة النموذجية · Model answer</button></div>
  <div class="box key hidden" style="margin-top:12px"><div class="lang2"><div dir="rtl">${o.ar.a}</div><div dir="ltr">${o.en.a}</div></div></div></div></section>`;
 });
 app.innerHTML=h;window.scrollTo(0,0);
}
home();
</script>
